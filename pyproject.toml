[project]
name = "vaani"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manas Jain", email = "344398359+manasjainwork@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jiwer>=4.0.0",
    "mkdocs-material>=9.8.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
gpu = [
    "torch>=2.15.0",
]

[tool.uv]
default-groups = ["dev", "gpu"]
